# sonnora VPS — mercadomio.qa.sonnora.mx
# Installed by: ./deploy.sh --env qa --register-vps
#
# Proxies to sonnora-qa (mercadomio app-nginx Docker on :8080).
# TLS terminated here (certbot); SPA + API proxied to the app server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mercadomio.qa.sonnora.mx;

    location /.well-known/acme-challenge/ {
        root /var/www/astro;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mercadomio.qa.sonnora.mx;

    ssl_certificate /etc/letsencrypt/live/mercadomio.qa.sonnora.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercadomio.qa.sonnora.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://10.0.0.4:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }
}

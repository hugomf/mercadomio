name: mercadomio-nginx

services:
  nginx:
    image: nginx:alpine
    container_name: mercadomio-nginx
    restart: unless-stopped
    ports:
      - "${APP_NGINX_PORT:-5203}:80"
    volumes:
      - ./mercadomio-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/mercadomio:/var/www/mercadomio:ro
    networks:
      - app

networks:
  app:
    name: mercadomio-net
    external: true

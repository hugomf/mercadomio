name: mercadomio-infra

# Infrastructure services shared across all remote environments:
# postgres (app DB), mongo, redis.
#
# Consumed by sonnora-deploy/bin/deploy.sh --project mercadomio --env {dev|qa|prod}.
# Values come from the mercadomio.env written on the app server from
# deploy/env/{env}.env.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mercadomio}
    volumes:
      - mercadomio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mercadomio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mercadomio_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - mercadomio_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: mercadomio-net
    external: true

volumes:
  mercadomio_postgres_data:
  mercadomio_mongo_data:
  mercadomio_redis_data:

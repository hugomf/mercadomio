# Mercadomio app-nginx (app server)
#
# Topology:
#   sonnora (VPS, TLS termination) -> APP_HOST:8080 -> app-nginx (this container)
#   -> backend/frontend/admin (docker compose on the same host).
#
# Served on host port 8080 (mapped by docker-compose.nginx.yml). The SPA static
# build lives in /var/www/mercadomio (mounted ro). Backend/frontend/admin are
# reached via host.docker.internal on the ports baked in by envsubst.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> Go backend (host.docker.internal)
    location /api/ {
        proxy_pass http://host.docker.internal:${BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Health endpoint -> backend
    location = /health {
        proxy_pass http://host.docker.internal:${BACKEND_PORT}/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Admin console -> admin docker container
    location /admin/ {
        proxy_pass http://host.docker.internal:${ADMIN_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Storefront static SPA
    root /var/www/mercadomio;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

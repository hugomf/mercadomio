name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  MONGO_URI: mongodb://localhost:27017/mercadomio
  REDIS_URI: redis://localhost:6379
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  CONEKTA_SECRET_KEY: ${{ secrets.CONEKTA_SECRET_KEY }}
  USERBREW_ISSUER: ${{ secrets.USERBREW_ISSUER }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            backend/vendor
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Install Go dependencies
        run: cd backend && go mod download && go mod vendor
      - name: Build
        run: cd backend && go build ./...
      - name: Unit tests
        run: cd backend && go test -count=1 -timeout 120s ./...
      - name: Integration tests
        run: cd backend && go test -count=1 -timeout 180s -tags=integration ./...

  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22'
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd frontend && flutter pub get
          cd ../admin_console && flutter pub get
      - name: Analyze frontend
        run: cd frontend && flutter analyze
      - name: Analyze admin console
        run: cd admin_console && flutter analyze

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, flutter-analyze]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: cd backend && docker build -t mercadomio-backend:${{ github.sha }} .
      - name: Build frontend image
        run: cd frontend && docker build -t mercadomio-frontend:${{ github.sha }} .
      - name: Build admin console image
        run: cd admin_console && docker build -t mercadomio-admin:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "Deploy step - integrate with your infrastructure"

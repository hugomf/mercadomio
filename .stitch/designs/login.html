<!-- Navigation is suppressed for this transactional screen -->
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12 w-full max-w-md mx-auto">
<!-- Brand Header -->
<div class="mb-8 flex flex-col items-center">
<img class="h-16 w-auto object-contain drop-shadow-sm mb-6" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtHRmGIFZXAM6AzTW7X52ZsD4M2W3D0koaguAhdXqBvZwnYQ8u6G-wbDCziac4B6zwABdImKG_qngwjhXXIu8hmc7uzsuKUW0YI-OMgC5KJdHczcjUASBI7b-adWiG-KGoqAwuCYC4qWn-PkzrFeTLQcNeyGayCS3Vg28I97G27IalgqwslnROkkZgxM-VJ7f6Bv0D4-IZu1NPg_JRXIym_sYoHPcrOw3Qm1zcgz-p5aChGXCmkbbYWvrXldL2lpSyFXZZ0wmZ9Bo"/>
<h1 class="font-display text-3xl font-extrabold tracking-tight text-on-surface text-center mb-3">
                ¡Hola!
            </h1>
<p class="text-on-surface-variant text-body-large text-center px-4 leading-relaxed">
                Inicia sesión para continuar comprando tus productos frescos.
            </p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-5 bg-surface-container-lowest p-6 rounded-2xl shadow-sm border border-outline-variant/30 relative overflow-hidden">
<!-- Decorative accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
<div class="flex flex-col gap-1.5">
<label class="font-label text-label-large font-semibold text-on-surface" for="email">
                    Correo electrónico
                </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px]">
                        mail
                    </span>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="tu@correo.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label text-label-large font-semibold text-on-surface" for="password">
                    Contraseña
                </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 text-[20px]">
                        lock
                    </span>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-xl pl-10 pr-12 py-3 focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70 hover:text-primary transition-colors flex items-center justify-center h-full focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">
                            visibility
                        </span>
</button>
</div>
</div>
<!-- Utility Link -->
<div class="flex justify-end mt-[-8px]">
<a class="text-primary font-label text-label-medium font-semibold hover:text-primary-fixed-variant transition-colors hover:underline" href="#">
                    ¿Olvidaste tu contraseña?
                </a>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary py-3.5 rounded-xl font-label font-bold text-body-large shadow-sm shadow-primary/20 hover:bg-on-primary-fixed-variant hover:shadow-md hover:-translate-y-0.5 active:scale-95 transition-all duration-200 mt-2" type="submit">
                Iniciar sesión
            </button>
</form>
<!-- Divider -->
<div class="w-full flex items-center my-8">
<div class="flex-1 border-t border-outline-variant/50"></div>
<span class="px-4 text-on-surface-variant text-body-small font-medium uppercase tracking-wider">o</span>
<div class="flex-1 border-t border-outline-variant/50"></div>
</div>
<!-- Secondary CTA -->
<a class="w-full bg-surface-container-low text-primary border border-outline-variant/50 py-3.5 rounded-xl font-label font-bold text-body-large text-center hover:bg-surface-container hover:text-primary-container active:scale-95 transition-all duration-200" href="#">

        </p>
</footer>

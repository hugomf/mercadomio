<body class="min-h-screen flex flex-col bg-surface-container-low font-body text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-6 md:p-12 w-full">
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Header -->
<div class="flex items-center justify-center gap-3 mb-8"><img alt="Mercadomio Logo" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLt7ck576kUp0KAu_Lv9xZ8boWKQVeU2sj4pZ1j4SG5bDbr6Llqv6UHh2a05C4pZ1SWaEIGR8jnK8aSvQdA_-KeAcyc3UCEbHfeBxrZ5GEQk9FucHccxfhbzv_Q4MZ2a5CWe7IM9qnQRwzup23ODCtQHLcURTqPhyjTZvyqYTV1UrBlzAvMrs8YlGZCTkFaE_UgOIczr62p6L7m-6eVI2RUfPPY2GNRMV4VEucjec6xylvZfR1nMLW0XKg">
<h1 class="text-3xl font-headline font-black text-primary tracking-tight">Mercadomio</h1></div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-8 md:p-10">
<div class="text-center mb-8">
<h2 class="text-2xl font-headline font-bold text-on-surface mb-2">Iniciar sesión</h2>
<p class="text-sm font-body text-on-surface-variant">Ingresa a tu cuenta para continuar</p>
</div>
<form action="#" class="flex flex-col gap-5" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-label font-medium text-on-surface" for="email">Correo electrónico</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-surface-container-lowest border border-outline rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body text-sm outline-none" id="email" name="email" placeholder="tucorreo@ejemplo.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-label font-medium text-on-surface" for="password">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-2.5 bg-surface-container-lowest border border-outline rounded-lg text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body text-sm outline-none" id="password" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-xl">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-[-8px]">
<a class="text-sm font-label font-medium text-primary hover:text-primary-container transition-colors underline-offset-4 hover:underline" href="#">
                            ¿Olvidaste tu contraseña?
                        </a>
</div>
<!-- Primary Action -->
<button class="w-full mt-2 bg-primary hover:bg-primary-container text-on-primary font-label font-bold py-3 px-4 rounded-lg shadow-sm active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        Iniciar sesión
                        <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 600;">login</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-6">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-sm font-label text-on-surface-variant">o</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-transparent border-2 border-outline hover:border-primary text-primary font-label font-bold py-2.5 px-4 rounded-lg active:scale-[0.98] transition-all flex items-center justify-center" type="button">
                    Crear cuenta nueva
                </button>
</div>
</div>
</main>
<!-- Footer Component (From JSON) -->
<footer class="bg-surface-container-low dark:bg-surface-container-lowest text-primary dark:text-primary-fixed-dim font-label text-sm text-on-surface-variant dark:text-on-surface-variant w-full bottom-0 border-t border-outline-variant flex flex-col md:flex-row justify-between items-center px-8 py-12 w-full mt-auto">
<div class="mb-6 md:mb-0 flex flex-col items-center md:items-start gap-2">
<div class="text-lg font-headline font-bold text-primary dark:text-primary-fixed-dim flex items-center gap-2">
<span class="material-symbols-outlined">storefront</span>
                Mercadomio
            </div>
<p class="text-on-surface-variant">© 2024 Mercadomio. Sabor de México en tu hogar.</p>
</div>

<li class=""><a class="hover:text-primary dark:hover:text-primary-fixed underline transition-all duration-200" href="#">Privacidad</a></li>
<li class=""><a class="hover:text-primary dark:hover:text-primary-fixed underline transition-all duration-200" href="#">Términos</a></li>
<li class=""><a class="hover:text-primary dark:hover:text-primary-fixed underline transition-all duration-200" href="#">Contacto</a></li>
<li class=""><a class="hover:text-primary dark:hover:text-primary-fixed underline transition-all duration-200" href="#">Sobre Nosotros</a></li>
</ul>
</nav>
</footer>
<script>
        // Simple toggle for password visibility
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const icon = toggleBtn.querySelector('.material-symbols-outlined');

            if(toggleBtn && passwordInput && icon) {
                toggleBtn.addEventListener('click', () => {
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.textContent = 'visibility';
                    } else {
                        passwordInput.type = 'password';
                        icon.textContent = 'visibility_off';
                    }
                });
            }
        });
    </script>
